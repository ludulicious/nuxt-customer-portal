contributors:
  title: Help shape the portal.
  description: You do not need to start with a large pull request. A precise documentation correction, a failing authorization test, or a focused layer proposal can move the project forward.
  link:
    label: Contribution guide
    to: /contributing
  paths:
    - number: "01"
      title: Improve the documentation
      description: Correct behavior, add an example, or make a workflow easier to follow.
      to: /contributing/documentation
    - number: "02"
      title: Create a feature layer
      description: Build a portable module against the public core contracts.
      to: /contributing/create-a-layer
    - number: "03"
      title: Propose a module
      description: Shape a reusable capability with maintainers before investing in implementation.
      to: /contributing/propose-a-module
extensionModel:
  title: The extension model
  badge: Nuxt 4.5
  items:
    - title: Headless core
      description: With NuxtUI and better-auth as the basis, the headless core implements authentication and authorization, organizations,  users, members, authorization, database access, and shared server adapters.
    - title: Feature registry
      description: Layers register navigation, module menus, surfaces, dashboard widgets, and role policies without host edits.
    - title: Business layers
      description: Each feature owns its UI, API, translations, tests, and PostgreSQL schema.
hero:
  kicker: Public development preview
  title: Nuxt Customer Portal
  description: "A great starting point for your own or your client's customer portal. Ready to use modules for small agencies with timesheets, approvals and invoicing. "
  actions:
    - label: Get started
      to: /getting-started
      trailingIcon: i-lucide-arrow-right
      variant: solid
      testId: hero-get-started
    - label: Try the demo
      to: https://demo.nuxt-customer-portal.com
      external: true
      variant: outline
      testId: hero-demo
    - label: GitHub
      to: https://github.com/ludulicious/nuxt-customer-portal
      icon: i-simple-icons-github
      external: true
      variant: ghost
      testId: hero-github
  license:
    text: Nuxt Customer Portal is open source under the MIT License.
    linkLabel: Read compatibility and release status
    linkTo: /reference/compatibility-and-releases
hostedEvaluation:
  kicker: Hosted evaluation
  title: Want to try without installing?
  description: "We have a hosted version available of a fully implemented Nuxt Customer Portal. Fill in the form on portalnuxt.com and we'll create your own instance for you. "
  action:
    label: Request a hosted evaluation
    to: https://portalnuxt.com
seo:
  title: Nuxt Customer Portal — an extensible customer portal for Nuxt
  description: Build from composable Nuxt layers or configure the ready-to-run SaaS portal for your own organization.
  headline: Nuxt customer portal
