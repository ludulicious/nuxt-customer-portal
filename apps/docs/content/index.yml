contributors:
  title: Extend it around your business.
  description: Add a module for your own workflow using the shared authentication, organizations, and client management. Keep it in your application or share it as a Nuxt layer. Setup feedback and documentation corrections help too.
  link:
    label: Contribution guide
    to: /contributing
  paths:
    - number: '01'
      title: Improve the documentation
      description: Correct behavior, add an example, or make a workflow easier to follow.
      to: /contributing/documentation
    - number: '02'
      title: Create a feature layer
      description: Build a portable module against the public core contracts.
      to: /contributing/create-a-layer
    - number: '03'
      title: Propose a module
      description: Shape a reusable capability with maintainers before investing in implementation.
      to: /contributing/propose-a-module
extensionModel:
  title: A working starting point
  badge: Built with Nuxt
  items:
    - title: Your team
      description: Record project time, review submitted weeks, and turn approved billable work into invoices.
    - title: Your clients
      description: Give clients access to shared time, assigned reviews, and issued invoices in their own organization.
    - title: Your next module
      description: Add your own pages, API, and data, then connect them to the portal through its module registry.
hero:
  kicker: Nuxt Customer Portal · Open source
  title: A customer portal you can make your own.
  description: Start with client access, timesheets, approvals, and invoicing. Extend it with modules built around your business. Built with Nuxt and used by our small software agency for timesheets and invoicing.
  actions:
    - label: Get started
      to: /getting-started
      trailingIcon: i-lucide-arrow-right
      variant: solid
      testId: hero-get-started
    - label: Try the demo
      to: https://demo.nuxt-customer-portal.com
      external: true
      variant: outline
      testId: hero-demo
    - label: GitHub
      to: https://github.com/ludulicious/nuxt-customer-portal
      icon: i-simple-icons-github
      external: true
      variant: ghost
      testId: hero-github
  license:
    text: Nuxt Customer Portal is open source under the MIT License.
    linkLabel: Read compatibility and release status
    linkTo: /reference/compatibility-and-releases
hostedEvaluation:
  kicker: Hosted evaluation
  title: Try it with your own organization.
  description: Request a hosted evaluation at PortalNuxt to explore the workflow without setting up infrastructure. We review requests before provisioning a dedicated instance.
  action:
    label: Request a hosted evaluation
    to: https://portalnuxt.com
seo:
  title: Nuxt Customer Portal — an extensible customer portal for Nuxt
  description: An open-source Nuxt customer portal with client access, timesheets, approvals, and invoicing. Extend it with modules built around your business.
  headline: Nuxt customer portal
