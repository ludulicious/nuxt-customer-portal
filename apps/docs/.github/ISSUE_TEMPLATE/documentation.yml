name: Documentation feedback
description: Report an unclear, incomplete, outdated, or incorrect documentation page.
title: 'Docs: '
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Documentation page
      description: Paste the URL of the page this feedback is about.
      placeholder: https://portalnuxt.com/architecture/overview
    validations:
      required: true
  - type: input
    id: source_revision
    attributes:
      label: Verified Customer Portal revision
      description: Copy the revision shown in the “Help improve this page” panel.
      placeholder: 96bcf57
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs improvement?
      description: Explain what is unclear, missing, outdated, or incorrect.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: If you know how the page could improve, describe it here.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add source links, screenshots, version details, or related issues.
