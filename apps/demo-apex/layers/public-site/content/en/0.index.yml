title: 'Software built around your business'
description: Northstar Studio designs and develops web applications, customer portals and integrations. From the first idea to ongoing improvements, we work alongside your team.
seo:
  title: Northstar Studio — Software Development Agency
  description: Custom software development by Northstar Studio. Web applications, customer portals and integrations, with a shared workspace for requests, hours and invoices.
navigation: false
hero:
  links:
    - label: Log in
      icon: i-lucide-log-in
      to: /login
      size: xl
      color: primary
    - label: Sign up
      icon: i-lucide-user-plus
      to: /signup
      size: xl
      color: neutral
      variant: subtle
sections:
  - title: From an idea to working software
    description: We turn complex workflows into software that is clear to use and practical to maintain. Together, we define what matters, build it and improve it.
    id: features
    orientation: horizontal
    features:
      - title: Web applications
        description: Custom applications for the way your business works, from internal tools to customer-facing products.
        icon: i-lucide-code
      - title: Customer portals
        description: Give your customers one place to collaborate with your team and manage their work.
        icon: i-lucide-panels-top-left
      - title: Integrations
        description: Connect your existing systems and automate repetitive tasks with dependable APIs.
        icon: i-lucide-plug
  - title: Why Northstar Studio
    description: A development partner who keeps you involved, makes technical choices understandable and gives you visibility into the work.
    orientation: horizontal
    reverse: true
    features:
      - title: Build in small steps
        description: Review working software regularly and use what you learn to decide what comes next.
        icon: i-lucide-calendar-check
      - title: Understand the work
        description: See recorded hours and invoices in the same workspace as your requests.
        icon: i-lucide-chart-line
      - title: Keep improving
        description: Bring us bugs, questions and new ideas as your product and business evolve.
        icon: i-lucide-headset
features:
  title: Your shared project workspace
  description: Stay connected to the team building your software, with requests, recorded hours and billing in one place.
  items:
    - title: Feature requests
      description: Share an idea, explain the problem and follow its progress with our team.
      icon: i-lucide-clipboard-check
    - title: Invoices
      description: View invoice history, download PDFs and manage billing details.
      icon: i-lucide-file-text
    - title: Bugs and support
      description: Report an issue with the context and priority we need to investigate it.
      icon: i-lucide-mail-plus
    - title: Timesheets
      description: Review hours recorded against your projects and activities.
      icon: i-lucide-clock
    - title: Notifications
      description: Keep track of updates to your requests and ongoing work.
      icon: i-lucide-bell
cta:
  title: Let’s build your next application
  description: Have a project in mind? Talk to Northstar Studio. Already working with us? Open your workspace to pick up where you left off.
  links:
    - label: Sign up
      to: '/signup'
      color: primary
      icon: i-lucide-user-plus
    - label: Log in
      to: '/login'
      variant: subtle
      icon: i-lucide-log-in
