name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nuxt-customer-portal-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customer_portal_ci
  PUBLIC_URL: http://127.0.0.1:3000
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: customer-portal-ci-secret-at-least-32-characters
  PORTAL_REGISTRATION_MODE: open

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:saas-boundary
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm pack:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:demos
      - run: pnpm test:e2e:docs

  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manager: [pnpm, npm, yarn, bun]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: matrix.manager == 'yarn'
        run: corepack enable
      - if: matrix.manager == 'npm'
        run: npm install --global npm@11.6.1
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx scripts/verify-packages.ts --consumers --manager=${{ matrix.manager }}
