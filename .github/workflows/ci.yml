name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nuxt-customer-portal-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customer_portal_ci
      PUBLIC_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: customer-portal-ci-secret-at-least-32-characters
      PORTAL_REGISTRATION_MODE: open
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Detect documentation changes
        id: changes
        run: |
          if git diff --quiet HEAD^ HEAD -- apps/docs docs README.md CONTRIBUTING.md package.json pnpm-lock.yaml pnpm-workspace.yaml 'packages/*/package.json' 'packages/*/portal.manifest.mjs' .github/workflows; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:saas-boundary
      - run: pnpm test:packages
      - run: pnpm format:check
      - run: pnpm --filter @nuxt-customer-portal/saas-portal typecheck
      - if: steps.changes.outputs.docs == 'true'
        run: pnpm test:docs
