name: Full release verification

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to verify
        required: true
        type: string
    outputs:
      commit_sha:
        description: Exact commit verified by every job
        value: ${{ jobs.source.outputs.commit_sha }}
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to verify without publishing
        required: true
        default: master
        type: string

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customer_portal_ci
  PUBLIC_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: customer-portal-ci-secret-at-least-32-characters
  PORTAL_REGISTRATION_MODE: open

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve immutable verification commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:saas-boundary
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter '!@nuxt-customer-portal/docs' -r --if-present build
      - run: pnpm pack:check
      - name: Migrate demo test database
        working-directory: apps/demo-apex
        run: node ../../packages/kit/bin/nuxt-customer-portal.mjs db migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:demos
      - run: pnpm test:e2e:docs

  docs-image:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
      - name: Build standalone documentation image
        run: docker build --tag customer-portal-docs:ci apps/docs

  consumers:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manager: [pnpm, npm, yarn, bun]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: matrix.manager == 'yarn'
        run: corepack enable
      - if: matrix.manager == 'npm'
        run: npm install --global npm@11.6.1
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx scripts/verify-packages.ts --consumers --manager=${{ matrix.manager }}

  starter:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal_starter_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:starter
        env:
          PORTAL_STARTER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portal_starter_test_ci
      - run: pnpm pack:starter
