name: Full release verification

on:
  pull_request:
    paths:
      - .github/workflows/release-*.yml
      - packages/*/package.json
      - packages/*/portal.manifest.mjs
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to verify
        required: true
        type: string
    outputs:
      commit_sha:
        description: Exact commit verified by every job
        value: ${{ jobs.source.outputs.commit_sha }}
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to verify without publishing
        required: true
        default: master
        type: string

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customer_portal_ci_test
  PUBLIC_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: customer-portal-ci-secret-at-least-32-characters
  PORTAL_REGISTRATION_MODE: open

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Resolve immutable verification commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_portal_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:saas-boundary
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:db
        env:
          PORTAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customer_portal_ci_test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portal_release_e2e
      - name: Verify daily demo reset
        run: node --import tsx apps/saas-portal/layers/demo/test/database.integration.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portal_release_e2e_demo
      - name: Upload failed portal browser results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portal-browser-results
          path: test-results/portal
          if-no-files-found: ignore
