name: Release Customer Portal image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to publish (for example 1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: customer-portal-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image tags
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_TAG:-$INPUT_VERSION}"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "Version must be a semantic version" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nuxt-customer-portal"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and publish portal image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/demo-apex/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Customer Portal image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          printf '{"image":"%s","version":"%s","commit":"%s","digest":"%s","reference":"%s@%s"}\n' \
            "$IMAGE" "$VERSION" "$GITHUB_SHA" "$DIGEST" "$IMAGE" "$DIGEST" > portal-image.json
      - uses: actions/upload-artifact@v7
        with:
          name: customer-portal-image-${{ steps.image.outputs.version }}
          path: portal-image.json
          if-no-files-found: error
