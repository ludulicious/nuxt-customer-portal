name: Release packages and portal image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to verify and publish (for example v1.2.3)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "An existing stable release tag is required" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: Check release package versions
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs'
          const version = process.env.RELEASE_TAG.replace(/^v/, '')
          for (const entry of readdirSync('packages', { withFileTypes: true })) {
            if (!entry.isDirectory()) continue
            const manifest = JSON.parse(readFileSync(`packages/${entry.name}/package.json`, 'utf8'))
            if (!manifest.private && manifest.version !== version) {
              throw new Error(`${manifest.name}: expected release version ${version}, found ${manifest.version}`)
            }
          }
          NODE
      - name: Resolve release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/release-verification.yml
    with:
      ref: ${{ needs.resolve.outputs.commit_sha }}

  publish:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish unpublished package versions
        run: pnpm release-packages
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}

  portal-image:
    needs: [resolve, verify]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-portal-image.yml
    with:
      commit_sha: ${{ needs.verify.outputs.commit_sha }}
      release_tag: ${{ needs.resolve.outputs.release_tag }}
