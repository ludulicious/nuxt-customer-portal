name: Bug report
description: Report reproducible Customer Portal behavior that is incorrect or unsafe.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include secrets, customer data, invoices, personal timesheets, session cookies, or database exports. Report security vulnerabilities privately through the Security tab.
  - type: input
    id: revision
    attributes:
      label: Customer Portal revision
      description: Paste the full output of `git rev-parse HEAD`.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: input
    id: layer_route
    attributes:
      label: Layer and route
      description: Name the affected layer and page or API route.
      placeholder: timesheets — /timesheets/reports or /api/timesheets/...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js, pnpm, PostgreSQL, browser, operating system, locale, and deployment details that affect reproduction.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic records and provide the smallest sequence that reproduces the problem.
      placeholder: |
        1. Sign in as an organization member with ...
        2. Open ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: organization_scope
    attributes:
      label: Organization scope checked
      description: Does the behavior depend on the active organization or user role?
      options:
        - Yes — organization or role context is included above
        - No — the behavior is not organization-specific
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add a minimal repository, test, screenshot, or log excerpt with all private data removed.
